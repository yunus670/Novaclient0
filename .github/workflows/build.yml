name: Build NovaClient
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unzip source
        run: |
          for z in *.zip; do unzip -oq "$z"; done
      - name: Build
        run: cd NovaClient && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NovaClient-jar
          path: |
            NovaClient/build/libs/*.jar
            !NovaClient/build/libs/*-sources.jar
